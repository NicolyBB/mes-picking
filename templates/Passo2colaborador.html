{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MES PICKING - Login Colaborador</title>

    <link rel="icon" href="{% static 'img/KYLY_logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Biblioteca Oficial da Indústria para ler QR/Barcode pela Câmera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* ── Botões do passo 2 ── */
        .btns-passo2 {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
        }
    </style>
</head>

<body class="pnl-pick pnl-step-2">
    <div class="mobile-wrapper">
        <header>
            <a href="{% url 'login_supervisor' %}" class="btn-voltar">&#8592;</a>
            <h1>MES PICKING</h1>
        </header>

        <main class="centro" style="justify-content: center; padding-top: 20px;">
            <span class="passo-label">PASSO 2/2</span>
            <h2 style="text-align: center; width: 100%; margin-bottom: 20px;">Bipe o crachá do <strong>COLABORADOR</strong></h2>

            <!-- 1. INPUT AUTOFOCUS: O Laser "digitará" o código aqui sozinho -->
            <input type="text" id="codigoColaborador" class="campo-texto"
                placeholder="Aguardando leitura do laser..."
                autofocus autocomplete="off" style="text-align: center; max-width: 320px;">

            <!-- 2. STATUS DE COMUNICAÇÃO -->
            <div id="status-comunicacao" style="margin-top: 12px; width: 100%; max-width: 320px;"></div>

            <!-- 3. BOTÕES CENTRALIZADOS -->
            <div class="btns-passo2">
                <!-- Câmera Real -->
                <button onclick="iniciarScannerCamera('codigoColaborador');" class="btn-confirmar"
                    style="background: #003366; color: #d4af11; border: 2px solid #d4af11; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    📷 Ler com Câmera Real
                </button>

                <!-- Confirmar / Simular Bip -->
                <a href="{% url 'abertura_caixa' %}" class="btn-confirmar"
                    style="text-decoration: none; display: flex; align-items: center; justify-content: center; width: 100%;">
                    ✔ Confirmar / Simular Bip
                </a>
            </div>
        </main>

        <!-- JavaScript padronizado -->
        <script src="{% static 'js/script.js' %}"></script>
    </div>

    <!-- MODAL DO SCANNER DE CÂMERA -->
    <div id="scanner-modal" class="modal-erro"
        style="display: none; flex-direction: column; background-color: rgba(11, 18, 32, 0.95);">
        <div class="modal-conteudo" style="background: #0f1a2e; border: 2px solid #d4af11; max-width: 350px;">
            <h2 style="color: #d4af11; font-size: 22px;">Câmera Ativada</h2>
            <p style="font-size: 14px; color: #ccc;">Aponte para o crachá do Colaborador</p>

            <div id="reader"
                style="width: 100%; min-height: 250px; background: #000; margin-bottom: 20px; border-radius: 8px; overflow: hidden;">
            </div>

            <button onclick="fecharScannerCamera()" class="btn-cancelar"
                style="width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                Cancelar
            </button>
        </div>
    </div>
</body>

</html>
